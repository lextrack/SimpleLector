name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage (x86_64)
            runner: ubuntu-22.04
            gradle_task: :composeApp:createDistributable
            artifact_name: SimpleLector-linux-x86_64-appimage
            artifact_path: composeApp/build/compose/binaries/main/appimage/*.AppImage
          - name: Windows (.msi)
            runner: windows-latest
            gradle_task: :composeApp:packageMsi
            artifact_name: SimpleLector-windows-msi
            artifact_path: composeApp/build/compose/binaries/main/msi/*.msi

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Windows packaging dependency
        if: runner.os == 'Windows'
        run: choco install wixtoolset --yes --no-progress

      - name: Run desktop tests and create package
        shell: bash
        run: ./gradlew :composeApp:jvmTest ${{ matrix.gradle_task }} --no-daemon

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          appimage_runtime="$RUNNER_TEMP/runtime-x86_64"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$appimagetool"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
            --output "$appimage_runtime"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $appimagetool" | sha256sum --check
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $appimage_runtime" | sha256sum --check
          chmod 755 "$appimagetool"
          bash scripts/package-appimage.sh \
            composeApp/build/compose/binaries/main/app/SimpleLector \
            composeApp/build/compose/binaries/main/appimage/SimpleLector-1.0.9-x86_64.AppImage \
            "$appimagetool" \
            "$appimage_runtime"

      - name: Upload desktop package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
